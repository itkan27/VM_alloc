# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── ML Service ───────────────────────────────────────────────────────────────
# URL of the Python FastAPI classifier service
ml.service.url=http://localhost:8000

# ── Allocation policy ────────────────────────────────────────────────────────
# ZONED  = every VM starts in the Eco Zone; spiky VMs live-migrate to the
#          Performance Zone while they spike (default)
# MIDSEM = midsem zone-unaware bin-packing, no migration (ablation baseline)
# ARA / FIRST_FIT / BEST_FIT = base paper and its baselines (also run by the comparison)
sim.policy=ZONED

# ── CloudSim Plus Datacenter ─────────────────────────────────────────────────
# Total hosts; the first sim.host.performance.count form the Performance Zone,
# the rest the Eco Zone.
sim.host.count=10
sim.host.storage=1000000
# POWER_OFF = hosts without VMs draw no power | KEEP_IDLE = they draw idle power
sim.host.idlePolicy=POWER_OFF

# Performance Zone hosts (mips is per PE → 4 × 5000 = 20 000 MIPS per host).
# Bandwidth (Mbps) also sets how fast VMs migrate in: 8 GB at 40 Gbps ≈ 1.6 s.
sim.host.performance.count=3
sim.host.performance.pes=4
sim.host.performance.mips=5000
sim.host.performance.ram=65536
sim.host.performance.bandwidth=40000
sim.host.performance.powerModel.maxWatts=400
sim.host.performance.powerModel.idleWatts=150

# Eco Zone hosts (4 × 1000 = 4 000 MIPS per host)
sim.host.eco.pes=4
sim.host.eco.mips=1000
sim.host.eco.ram=32768
sim.host.eco.bandwidth=10000
sim.host.eco.powerModel.maxWatts=250
sim.host.eco.powerModel.idleWatts=80

# ── Spike simulation (SPIKY VMs, numbered 1, 2, 3 … in submission order) ─────
# Odd-numbered VMs spike 15 s after they start, for 5 s; even-numbered after 20 s,
# for 5 s. With repeat=true the pattern recurs for as long as the VM runs.
# During a spike CPU goes from avgCpu to maxCpu and RAM usage to ramSpikePercent.
sim.spike.repeat=true
sim.spike.odd.afterSeconds=15
sim.spike.odd.durationSeconds=5
sim.spike.even.afterSeconds=20
sim.spike.even.durationSeconds=5
sim.spike.ramBaselinePercent=50
sim.spike.ramSpikePercent=90

# ── Live migration thresholds ────────────────────────────────────────────────
# A spiky VM moves to the Performance Zone when ANY threshold is crossed and back
# to the Eco Zone when ALL are below again (0 disables a threshold).
sim.migration.enabled=true
sim.migration.cpuThresholdPercent=70
sim.migration.ramThresholdPercent=85
sim.migration.mipsThreshold=3000
# Share of the target host's bandwidth used to copy VM memory (CloudSim default 0.5)
sim.migration.bandwidthPercent=1.0

# ── Base paper ARA policy (used by the comparison, or with sim.policy=ARA) ───
# Score = alpha·Available_CPU + beta·Available_RAM + gamma·Energy_Efficiency − delta·Migration_Cost
sim.ara.alpha=0.4
sim.ara.beta=0.3
sim.ara.gamma=0.3
sim.ara.delta=0.2
# Hosts below this CPU % are emptied onto busier active hosts every interval
sim.ara.underutilizedThresholdPercent=20
sim.ara.consolidationIntervalSeconds=30
# EWMA weight of the newest load sample in the demand prediction
sim.ara.predictionSmoothing=0.5
# Migration time (s) that counts as the maximum migration cost
sim.ara.migrationCostNormSeconds=10

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.vmalloc=INFO
# Suppress verbose CloudSim Plus output
logging.level.org.cloudsimplus=WARN
